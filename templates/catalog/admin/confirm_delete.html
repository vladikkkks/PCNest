{% extends 'base.html' %}
{% block title %}Видалити компонент — PC-NEST{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 text-center">
      <i class="bi bi-trash fs-1 text-danger mb-3"></i>
      <h5>Видалити «{{ component.brand }} {{ component.name }}»?</h5>
      <p class="text-muted">Компонент буде видалено з усіх збірок.</p>
      <div class="d-flex gap-2 justify-content-center mt-2">
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Так, видалити</button>
        </form>
        <a href="{% url 'catalog:admin_list' %}" class="btn btn-outline-secondary">Скасувати</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
