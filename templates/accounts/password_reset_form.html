{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Відновлення пароля — PC-NEST{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h4 class="fw-bold mb-3">Відновлення пароля</h4>
      <p class="text-muted small">Вкажіть email, і ми надішлемо лист для зміни пароля.</p>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-dark w-100">Надіслати лист</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
