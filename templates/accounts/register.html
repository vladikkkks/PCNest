{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load static %}
{% block title %}Реєстрація — PC-NEST{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <div class="text-center mb-3">
        <img src="{% static 'img/LOGO.webp' %}" alt="PC-NEST logo" style="max-width:160px;height:auto;">
      </div>
      <h4 class="fw-bold mb-4">Реєстрація</h4>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-dark w-100 mt-2">Зареєструватись</button>
      </form>
      <p class="text-center text-muted mt-3 mb-0">
        Вже є акаунт? <a href="{% url 'accounts:login' %}">Увійти</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
