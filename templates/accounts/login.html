{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% load static %}
{% block title %}Вхід — PC-NEST{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <div class="text-center mb-3">
        <img src="{% static 'img/LOGO.webp' %}" alt="PC-NEST logo" style="max-width:160px;height:auto;">
      </div>
      <h4 class="fw-bold mb-4">Вхід</h4>
      <form method="post">
        {% csrf_token %}
        {% if request.GET.next %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-dark w-100 mt-2">Увійти</button>
      </form>
      <div class="text-center mt-2">
        <a href="{% url 'accounts:password_reset' %}" class="small">Забули пароль?</a>
      </div>
      <p class="text-center text-muted mt-3 mb-0">
        Немає акаунту? <a href="{% url 'accounts:register' %}">Зареєструватись</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
